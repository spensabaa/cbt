<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SMPN 1 Bangsal | CBT Online Assessment System</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> 
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #334155;
      user-select: none;
      overflow-x: hidden;
    }
    h1, h2, h3, h4, h5, h6, .font-heading { font-family: 'Poppins', sans-serif; }
    .glass {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
    }
    .fade-in { animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="overflow-x-hidden text-slate-800">

  <!-- HALAMAN LOGIN UTAMA -->
  <div class="flex items-center justify-center min-h-screen bg-cover bg-center relative p-4"
    style="background-image: url('https://images.unsplash.com/photo-1562774053-701939374585?q=80&w=1986&auto=format&fit=crop');">
    <div class="absolute inset-0 bg-black/60 z-0"></div>

    <div class="glass w-full max-w-sm p-6 rounded-2xl shadow-2xl fade-in relative z-10 overflow-hidden">
      <div class="text-center mb-6 relative z-10">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-white mb-3 shadow-xl ring-4 ring-blue-50 p-3">
          <i class="fas fa-graduation-cap text-2xl text-blue-700"></i>
        </div>
        <h1 class="text-xl font-bold text-slate-800 tracking-tight">SMPN 1 Bangsal</h1>
        <p class="text-sm text-slate-600 mt-1 font-medium">CBT Online Assessment System</p>
        
        <div class="mt-3 py-1.5 px-3 rounded-xl bg-slate-800/70 inline-flex flex-col items-center gap-0.5 border border-slate-700/50">
          <div id="login-clock" class="text-lg font-bold text-white font-mono tracking-widest">--:--:--</div>
          <div id="login-date-display" class="text-[11px] text-slate-300"></div>
        </div>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="relative z-10 space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">User ID / NIS</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"><i class="fas fa-id-card"></i></span>
            <input type="text" id="username" class="pl-10 block w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-600 outline-none bg-white" placeholder="Contoh: ADM-001 / SIS-001" required>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"><i class="fas fa-lock"></i></span>
            <input type="password" id="password" class="pl-10 pr-10 block w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-600 outline-none bg-white" placeholder="••••••••" required>
            <span class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer text-gray-400 hover:text-blue-600" onclick="togglePasswordVisibility()">
              <i class="fas fa-eye" id="icon-toggle-pass"></i>
            </span>
          </div>
        </div>

        <div id="pin-container">
          <label class="block text-xs font-bold text-red-600 uppercase tracking-wide mb-1">PIN Sesi Ujian (Siswa)</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-red-500"><i class="fas fa-key"></i></span>
            <input type="text" id="pin" name="pin" class="pl-10 block w-full px-4 py-2.5 text-sm border border-red-300 rounded-lg focus:ring-2 focus:ring-red-500 bg-red-50/50 tracking-widest font-bold text-slate-800" placeholder="123456">
          </div>
        </div>

        <div class="flex items-center justify-between">
          <label class="flex items-center cursor-pointer select-none">
            <input type="checkbox" id="isAdmin" class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500" onchange="togglePinInput()" checked>
            <span class="ml-2 text-sm text-slate-700 font-semibold">Login sebagai Admin</span>
          </label>
        </div>

        <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white py-2.5 text-sm rounded-lg font-bold shadow-lg transition flex justify-center items-center gap-2">
          <span>Masuk Aplikasi</span> <i class="fas fa-arrow-right"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- GLOBAL LOADING -->
  <div id="global-loading" class="fixed inset-0 bg-white/80 z-[60] flex items-center justify-center hidden">
    <div class="text-center">
      <i class="fas fa-circle-notch fa-spin text-4xl text-blue-600 mb-3"></i>
      <p class="text-slate-600 font-medium">Authenticating...</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://mcmtezrqxyefeqbckzim.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_gv8QoQPBse2LxuxUvX7bUw_N6blbilz';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Clock & Date Display
    setInterval(() => {
      const now = new Date();
      if (document.getElementById('login-clock')) document.getElementById('login-clock').innerText = now.toLocaleTimeString('id-ID', { hour12: false });
      if (document.getElementById('login-date-display')) {
        document.getElementById('login-date-display').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      }
    }, 1000);

    function togglePinInput() {
      const isAdmin = document.getElementById('isAdmin').checked;
      const pinContainer = document.getElementById('pin-container');
      const pinInput = document.getElementById('pin');
      
      if (isAdmin) {
        pinContainer.style.display = 'none';
        pinInput.removeAttribute('required');
        pinInput.value = '';
      } else {
        pinContainer.style.display = 'block';
        pinInput.setAttribute('required', 'true');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      togglePinInput();
    });

    function togglePasswordVisibility() {
      const pass = document.getElementById('password');
      pass.type = pass.type === 'password' ? 'text' : 'password';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const isAdmin = document.getElementById('isAdmin').checked;

      document.getElementById('global-loading').classList.remove('hidden');

      try {
        const { data, error } = await supabaseClient
          .from('users')
          .select('*')
          .eq('id', username)
          .eq('password', password)
          .single();

        document.getElementById('global-loading').classList.add('hidden');

        if (error || !data) throw new Error('User ID atau Password salah.');
        if (isAdmin && data.role !== 'Admin') throw new Error('Akun ini bukan Administrator.');

        // Simpan sesi login ke localStorage
        localStorage.setItem('cbt_user', JSON.stringify(data));

        // Redirect ke halaman dashboard.html untuk Admin
        if (isAdmin) {
          window.location.href = 'dashboard.html';
        } else {
          // Nanti dihubungkan ke halaman siswa (misal: exam-room.html)
          Swal.fire('Siswa Login', 'Fitur ujian siswa akan dibuka di halaman siswa.', 'info');
        }

      } catch (err) {
        document.getElementById('global-loading').classList.add('hidden');
        Swal.fire('Gagal Login', err.message, 'error');
      }
    }
  </script>
</body>
</html>
