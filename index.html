  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #334155;
      user-select: none;
      overflow-x: hidden;
    }
    h1, h2, h3, h4, h5, h6, .font-heading { font-family: 'Poppins', sans-serif; }
    .glass {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
    }
    .fade-in { animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .sidebar-bg { background: #1e293b; border-right: 1px solid rgba(255, 255, 255, 0.05); color: #cbd5e1; }
    .sidebar-item {
      position: relative; display: flex; align-items: center; padding: 12px 16px;
      margin-bottom: 4px; border-radius: 8px; cursor: pointer; transition: all 0.2s ease;
      white-space: nowrap; font-weight: 500; font-size: 0.9rem;
    }
    .sidebar-item:hover { background: rgba(255, 255, 255, 0.08); color: #f1f5f9; }
    .sidebar-item.active { background: #2563eb; color: #fff; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
    .sidebar-item i { width: 24px; text-align: center; margin-right: 12px; font-size: 1.1rem; flex-shrink: 0; }
    .dash-card {
      background: #ffffff; border-radius: 16px; border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02); overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

      width: 48px; height: 48px; border-radius: 12px; display: flex;
      align-items: center; justify-content: center; font-size: 1.25rem;

<body class="overflow-x-hidden text-slate-800">

    <!-- 2. HALAMAN ADMIN DASHBOARD -->

  <div id="global-loading" class="fixed inset-0 bg-white/80 z-[60] flex items-center justify-center hidden">
    <div class="text-center">
      <i class="fas fa-circle-notch fa-spin text-4xl text-blue-600 mb-3"></i>
      <p class="text-slate-600 font-medium">Memuat Data...</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://mcmtezrqxyefeqbckzim.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_gv8QoQPBse2LxuxUvX7bUw_N6blbilz';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Realtime Clock
    setInterval(() => {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('id-ID', { hour12: false }).replace(/:/g, '.');
      const dateStr = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      if (document.getElementById('login-clock')) document.getElementById('login-clock').innerText = now.toLocaleTimeString('id-ID', { hour12: false });
      if (document.getElementById('login-date-display')) document.getElementById('login-date-display').innerText = dateStr;
      if (document.getElementById('current-time-display')) document.getElementById('current-time-display').innerText = timeStr;
      if (document.getElementById('current-date-display')) document.getElementById('current-date-display').innerText = dateStr;
    }, 1000);

    function togglePinInput() {
      const isAdmin = document.getElementById('isAdmin').checked;
      document.getElementById('pin-container').style.display = isAdmin ? 'none' : 'block';
    }

    function togglePasswordVisibility() {
      const pass = document.getElementById('password');
      pass.type = pass.type === 'password' ? 'text' : 'password';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const isAdmin = document.getElementById('isAdmin').checked;

      document.getElementById('global-loading').classList.remove('hidden');

      try {
        const { data, error } = await supabaseClient
          .from('users')
          .select('*')
          .eq('id', username)
          .eq('password', password)
          .single();

        document.getElementById('global-loading').classList.add('hidden');

        if (error || !data) throw new Error('User ID atau Password salah.');
        if (isAdmin && data.role !== 'Admin') throw new Error('Akun ini bukan Administrator.');

        document.getElementById('page-login').classList.add('hidden');
        document.getElementById('page-admin').classList.remove('hidden');
        switchTab('dash-home');
      } catch (err) {
        document.getElementById('global-loading').classList.add('hidden');
        Swal.fire('Gagal Login', err.message, 'error');
      }
    }

    function switchTab(tabId, el) {
      if (el) {
        document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
      }
      const content = document.getElementById('admin-content');
      const title = document.getElementById('admin-header-title');

      if (tabId === 'dash-home') {
        title.innerText = 'Dashboard Overview';

                </div>

                  <span class="text-sm font-bold text-slate-700">Jumat, 23 Oktober 2026</span>
                </div>
                <button onclick="switchTab('dash-home')" class="px-4 py-2 border border-slate-200 hover:bg-slate-50 text-slate-700 font-bold rounded-xl text-sm flex items-center gap-2 transition">

                </button>
                <button onclick="switchTab('dash-exams')" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-sm shadow-lg shadow-blue-500/20 flex items-center gap-2 transition">
                  <i class="fas fa-plus"></i> Buat Ujian
                </button>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
              <div class="dash-card p-6 flex justify-between items-center">
                <div>
                  <p class="text-[11px] uppercase tracking-wider text-slate-400 font-bold">Total Jadwal</p>
                  <h3 class="text-3xl font-black text-slate-800 mt-1">0</h3>
                  <div class="flex items-center gap-2 mt-2">
                    <span class="text-[11px] bg-blue-50 text-blue-600 font-bold px-2 py-0.5 rounded-full"><i class="fas fa-check-circle mr-1"></i> 0 Aktif</span>
                    <span class="text-[11px] text-slate-400 font-medium">0 Non-Aktif</span>
                  </div>
                </div>
                <div class="stat-card-icon bg-blue-50 text-blue-600"><i class="fas fa-book"></i></div>
              </div>

              <div class="dash-card p-6 flex justify-between items-center">
                <div>
                  <p class="text-[11px] uppercase tracking-wider text-slate-400 font-bold">Status Peserta</p>
                  <h3 class="text-3xl font-black text-slate-800 mt-1">Online</h3>
                  <div class="mt-2"><span class="text-[11px] bg-emerald-50 text-emerald-600 font-bold px-2.5 py-1 rounded-full"><i class="fas fa-wifi mr-1"></i> Sistem Stabil</span></div>
                </div>
                <div class="stat-card-icon bg-emerald-50 text-emerald-600"><i class="fas fa-users"></i></div>
              </div>

              <div class="dash-card p-6 flex justify-between items-center">
                <div>
                  <p class="text-[11px] uppercase tracking-wider text-slate-400 font-bold">Bank Soal</p>
                  <h3 class="text-3xl font-black text-slate-800 mt-1">0</h3>
                  <div class="mt-2"><span class="text-[11px] bg-purple-50 text-purple-600 font-bold px-2 py-0.5 rounded-full"><i class="fas fa-layer-group mr-1"></i> Mapel</span> Terdaftar di sistem</div>
                </div>
                <div class="stat-card-icon bg-purple-50 text-purple-600"><i class="fas fa-database"></i></div>
              </div>

              <div class="dash-card p-6 flex justify-between items-center">
                <div>
                  <p class="text-[11px] uppercase tracking-wider text-slate-400 font-bold">Mode Akses</p>
                  <h3 class="text-3xl font-black text-slate-800 mt-1">Admin</h3>
                  <div class="mt-2 text-xs text-slate-400 font-medium flex items-center gap-1"><i class="fas fa-clock"></i> 13.14 WIB</div>
                </div>
                <div class="stat-card-icon bg-amber-50 text-amber-600"><i class="fas fa-user-shield"></i></div>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div class="dash-card p-6 lg:col-span-2">
                <div class="flex justify-between items-center mb-6">
                  <h3 class="font-bold text-lg text-slate-800">Aktivitas Terkini</h3>
                  <a href="#" class="text-xs text-blue-600 font-bold hover:underline">Lihat Log Lengkap</a>
                </div>
                <div class="space-y-4 border-l-2 border-blue-100 ml-2 pl-4">
                  <div>
                    <div class="text-xs text-blue-600 font-bold">Baru saja</div>
                    <div class="font-bold text-sm text-slate-800 mt-0.5">Login Berhasil</div>
                    <div class="text-xs text-slate-500">Anda masuk sebagai Administrator.</div>
                  </div>
                  <div>
                    <div class="text-xs text-slate-400 font-bold">Hari ini</div>
                    <div class="font-bold text-sm text-slate-800 mt-0.5">Sinkronisasi Data</div>
                    <div class="text-xs text-slate-500">Mengambil data ujian terbaru dari database.</div>
                  </div>
                </div>
              </div>

              <div class="dash-card p-6 bg-[#0f172a] text-white flex flex-col justify-between">
                <div>
                  <div class="flex items-center gap-2 mb-3">
                    <i class="fas fa-info-circle text-blue-400 text-lg"></i>
                    <h3 class="font-bold text-base">Informasi Penting</h3>
                  </div>
                  <p class="text-xs text-slate-300 leading-relaxed">Refresh Data setelah melakukan perubahan manual pada Database Supabase.</p>
                </div>
                <div class="mt-6 p-4 rounded-xl bg-slate-800/80 border border-slate-700">
                  <div class="flex items-center gap-2 text-yellow-400 font-bold text-xs mb-1">
                    <i class="fas fa-shield-alt"></i> Anti-Cheat
                  </div>
                  <p class="text-[11px] text-slate-400">Aktif otomatis untuk sesi siswa.</p>
                </div>
              </div>
            </div>
          </div>
        `;

        title.innerText = 'Manajemen Jadwal Ujian';
        content.innerHTML = `

            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div>
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">

                <i class="fas fa-plus"></i> Buat Jadwal Baru
              </button>
            </div>

            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400"><i class="fas fa-search"></i></span>

            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">

                  <tr class="border-b border-slate-200 text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                    <th class="py-3 px-4">No</th>
                    <th class="py-3 px-4">Mata Pelajaran & Kelas</th>

                <tbody>
                  <tr>
                    <td colspan="6" class="py-16 text-center text-slate-400">
                      <div class="flex flex-col items-center justify-center">
                        <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 mb-2"><i class="fas fa-calendar-xmark text-xl"></i></div>
                        <p class="text-sm font-medium">Belum ada jadwal ujian.</p>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        `;
      } else if (tabId === 'dash-questions') {
        title.innerText = 'Bank Soal';
        content.innerHTML = `
          <div class="dash-card p-6 space-y-6 fade-in">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div>
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
