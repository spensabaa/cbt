<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SMPN 1 Bangsal | Ujian Online (Supabase Edition)</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> 
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.min.js"></script>
  
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" id="MathJax-script"></script>
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #334155;
      user-select: none;
      overflow-x: hidden;
    }
    h1, h2, h3, h4, h5, h6, .font-heading { font-family: 'Poppins', sans-serif; }
    .glass {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
    }
    .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .sidebar-bg { background: #2b369e; border-right: 1px solid rgba(0, 0, 0, 0.1); color: #e0e7ff; }
    .sidebar-item {
      position: relative; display: flex; align-items: center; padding: 12px 16px;
      margin-bottom: 4px; border-radius: 8px; cursor: pointer; transition: all 0.2s ease;
      white-space: nowrap; font-weight: 500; font-size: 0.9rem;
    }
    .sidebar-item:hover { background: rgba(255, 255, 255, 0.08); color: #f1f5f9; }
    .sidebar-item.active { background: #2563eb; color: #fff; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
    .sidebar-item i { width: 24px; text-align: center; margin-right: 12px; font-size: 1.1rem; flex-shrink: 0; }
    .dash-card {
      background: #ffffff; border-radius: 16px; border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02); overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column;
    }
    .dash-card:hover { transform: translateY(-3px); box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.06); border-color: #cbd5e1; }
    .stat-card-icon {
      width: 48px; height: 48px; border-radius: 12px; display: flex;
      align-items: center; justify-content: center; font-size: 1.25rem;
    }
    .exam-header { background: #2b369e; border-bottom: 1px solid rgba(255, 255, 255, 0.1); color: white; }
    .timer-capsule {
      background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(255, 255, 255, 0.2);
      color: #facc15; padding: 6px 16px; border-radius: 8px; display: flex; align-items: center; gap: 8px; font-family: 'Courier New', monospace;
    }
    .option-label {
      display: flex; align-items: center; padding: 16px 20px; border: 2px solid #e2e8f0;
      border-radius: 12px; cursor: pointer; transition: all 0.2s; background: #fff; position: relative;
    }
    .option-label:hover { background-color: #f8fafc; border-color: #cbd5e1; }
    .option-label.checked { border-color: #3b82f6; background-color: #eff6ff; }
    .custom-radio {
      width: 22px; height: 22px; border: 2px solid #cbd5e1; border-radius: 50%;
      margin-right: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: white;
    }
    .option-label.checked .custom-radio { border-color: #3b82f6; background: #3b82f6; }
    .option-label.checked .custom-radio::after { content: ''; width: 8px; height: 8px; background: white; border-radius: 50%; }
    .nav-btn-modern {
      width: 36px; height: 36px; font-size: 0.75rem; border-radius: 8px; font-weight: 600;
      border: 1px solid #e2e8f0; color: #64748b; background: white; display: flex; align-items: center; justify-content: center;
    }
    .nav-btn-modern.current { border: 2px solid #f59e0b; background: #fffbeb; color: #d97706; transform: scale(1.1); }
    .nav-btn-modern.answered { background: #3b82f6; border-color: #3b82f6; color: white; }
  </style>
</head>
<body class="overflow-x-hidden text-slate-800">

  <div id="app" class="min-h-screen relative">

    <!-- 1. HALAMAN LOGIN -->
    <div id="page-login" class="flex items-center justify-center min-h-screen bg-cover bg-center relative p-4"
      style="background-image: url('https://images.unsplash.com/photo-1562774053-701939374585?q=80&w=1986&auto=format&fit=crop');">
      <div class="absolute inset-0 bg-black/60 z-0"></div>

      <div class="glass w-full max-w-sm p-6 rounded-2xl shadow-2xl fade-in relative z-10 overflow-hidden">
        <div class="text-center mb-6 relative z-10">
          <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-white mb-3 shadow-xl ring-4 ring-blue-50 p-3">
            <i class="fas fa-graduation-cap text-2xl text-blue-700"></i>
          </div>
          <h1 class="text-xl font-bold text-slate-800 tracking-tight">SMPN 1 Bangsal</h1>
          <p class="text-sm text-slate-600 mt-1 font-medium">CBT Online Assessment System</p>
          
          <div class="mt-3 py-1.5 px-3 rounded-xl bg-slate-800/70 inline-flex flex-col items-center gap-0.5 border border-slate-700/50">
            <div id="login-clock" class="text-lg font-bold text-white font-mono tracking-widest">--:--:--</div>
            <div id="login-date-display" class="text-[11px] text-slate-300"></div>
          </div>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="relative z-10 space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">User ID / NIS</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"><i class="fas fa-id-card"></i></span>
              <input type="text" id="username" class="pl-10 block w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-600 outline-none bg-white" placeholder="Contoh: SIS-001" required>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Password</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"><i class="fas fa-lock"></i></span>
              <input type="password" id="password" class="pl-10 pr-10 block w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-600 outline-none bg-white" placeholder="••••••••" required>
              <span class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer text-gray-400 hover:text-blue-600" onclick="togglePasswordVisibility()">
                <i class="fas fa-eye" id="icon-toggle-pass"></i>
              </span>
            </div>
          </div>

          <div id="pin-container">
            <label class="block text-xs font-bold text-red-600 uppercase tracking-wide mb-1">PIN Sesi Ujian</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-red-500"><i class="fas fa-key"></i></span>
              <input type="text" id="pin" class="pl-10 block w-full px-4 py-2.5 text-sm border border-red-300 rounded-lg focus:ring-2 focus:ring-red-500 bg-red-50/50 tracking-widest font-bold text-slate-800" placeholder="123456" required>
            </div>
          </div>

          <div class="flex items-center justify-between">
            <label class="flex items-center cursor-pointer select-none">
              <input type="checkbox" id="isAdmin" class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500" onchange="togglePinInput()">
              <span class="ml-2 text-sm text-slate-700 font-semibold">Login sebagai Admin / Guru</span>
            </label>
          </div>

          <button type="submit" id="btnLogin" class="w-full bg-blue-700 hover:bg-blue-800 text-white py-2.5 text-sm rounded-lg font-bold shadow-lg transition flex justify-center items-center gap-2">
            <span>Masuk Aplikasi</span> <i class="fas fa-arrow-right"></i>
          </button>
        </form>
      </div>
    </div>

    <!-- 2. HALAMAN ADMIN DASHBOARD -->
    <div id="page-admin" class="hidden flex h-screen bg-slate-100 overflow-hidden">
      <aside id="admin-sidebar" class="sidebar-bg w-72 h-full flex flex-col fixed md:relative z-40 transition-all duration-300 shadow-xl">
        <div class="h-20 flex items-center justify-center border-b border-slate-700/50 px-6 bg-[#0f172a]">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center text-white shadow-lg">
              <i class="fas fa-graduation-cap text-xl"></i>
            </div>
            <div>
              <h1 class="text-white font-bold text-base tracking-tight">SMPN 1 Bangsal</h1>
              <p class="text-xs text-slate-400">Admin Panel</p>
            </div>
          </div>
        </div>

        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
          <p class="px-4 text-[10px] font-bold text-indigo-200 uppercase tracking-widest mb-2">Main Menu</p>
          <div class="sidebar-item active" onclick="showAdminTab('dash-home', this)"><i class="fas fa-home"></i> <span>Dashboard</span></div>
          <div class="sidebar-item" onclick="showAdminTab('dash-exams', this)"><i class="fas fa-calendar-days"></i> <span>Jadwal Ujian</span></div>
          <div class="sidebar-item" onclick="showAdminTab('dash-questions', this)"><i class="fas fa-book"></i> <span>Bank Soal</span></div>
          <div class="sidebar-item" onclick="showAdminTab('dash-results', this)"><i class="fas fa-chart-bar"></i> <span>Hasil & Nilai</span></div>
        </nav>

        <div class="p-4 border-t border-slate-700/50">
          <button onclick="logout()" class="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-lg text-sm font-medium text-red-200 bg-red-900/20 hover:bg-red-600 hover:text-white transition">
            <i class="fas fa-sign-out-alt"></i> Keluar
          </button>
        </div>
      </aside>

      <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 h-20 flex items-center justify-between px-6 z-30">
          <h2 class="text-xl font-bold text-slate-800" id="admin-header-title">Dashboard Overview</h2>
          <div class="text-right">
            <div class="text-xs text-slate-400" id="current-date-display"></div>
            <div class="text-sm font-bold text-slate-700 font-mono" id="current-time-display">--:--:--</div>
          </div>
        </header>

        <main class="flex-1 overflow-auto p-6 bg-slate-50" id="admin-content">
          <!-- Dinamis konten admin -->
        </main>
      </div>
    </div>

    <!-- 3. HALAMAN UJIAN SISWA -->
    <div id="page-exam" class="hidden h-screen flex flex-col bg-slate-50">
      <header class="exam-header h-16 px-6 py-3 flex items-center justify-between z-30 shrink-0 sticky top-0 shadow-md">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center text-white border border-white/20">
            <i class="fas fa-book-open"></i>
          </div>
          <div>
            <h1 class="font-bold text-white text-sm md:text-base" id="exam-subject-title">Memuat Ujian...</h1>
            <p class="text-xs text-blue-100"><span id="student-id-display">ID</span> · <span id="student-name-display">Siswa</span></p>
          </div>
        </div>

        <div class="timer-capsule">
          <i class="fas fa-stopwatch animate-pulse text-yellow-400"></i>
          <span id="timer-display" class="font-mono font-bold text-lg text-yellow-300">00:00:00</span>
        </div>

        <button onclick="finishExamManual()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-5 py-2 rounded-xl text-sm font-bold shadow-lg transition flex items-center gap-2">
          <span>Selesai</span> <i class="fas fa-check"></i>
        </button>
      </header>

      <div class="flex flex-1 overflow-hidden relative">
        <main class="flex-1 overflow-y-auto p-6" id="main-exam-area">
          <div class="max-w-4xl mx-auto pb-24">
            <div id="question-container" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 min-h-[400px]">
              <div class="flex flex-col items-center justify-center h-64 text-slate-400">
                <i class="fas fa-circle-notch fa-spin text-3xl mb-2"></i>
                <p>Menyiapkan soal...</p>
              </div>
            </div>

            <div class="flex justify-between items-center mt-6">
              <button onclick="prevQ()" id="btn-prev" class="px-5 py-2.5 rounded-xl font-bold text-sm text-slate-600 hover:bg-white transition border border-slate-200">
                <i class="fas fa-arrow-left mr-2"></i> Sebelumnya
              </button>
              <button onclick="nextQ()" id="btn-next" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-lg font-bold text-sm transition">
                Selanjutnya <i class="fas fa-arrow-right ml-2"></i>
              </button>
            </div>
          </div>
        </main>

        <aside class="w-72 bg-white border-l border-slate-200 flex flex-col p-4">
          <h3 class="font-bold text-slate-800 text-xs uppercase tracking-wide mb-3">Navigasi Soal</h3>
          <div id="nav-grid" class="grid grid-cols-5 gap-2"></div>
        </aside>
      </div>
    </div>

  </div>

  <div id="global-loading" class="fixed inset-0 bg-white/80 z-[60] flex items-center justify-center hidden">
    <div class="text-center">
      <i class="fas fa-circle-notch fa-spin text-4xl text-blue-600 mb-3"></i>
      <p class="text-slate-600 font-medium">Menghubungkan ke Supabase...</p>
    </div>
  </div>

  <script>
    // --- KREDENSIAL SUPABASE ---
    const SUPABASE_URL = 'https://mcmtezrqxyefeqbckzim.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_gv8QoQPBse2LxuxUvX7bUw_N6blbilz';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let currentExam = null;
    let questions = [];
    let answers = {};
    let currentQIndex = 0;
    let timerInterval = null;

    // --- INISIALISASI JAM REALTIME ---
    setInterval(() => {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('id-ID', { hour12: false });
      const dateStr = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });
      if (document.getElementById('login-clock')) document.getElementById('login-clock').innerText = timeStr;
      if (document.getElementById('login-date-display')) document.getElementById('login-date-display').innerText = dateStr;
      if (document.getElementById('current-time-display')) document.getElementById('current-time-display').innerText = timeStr;
      if (document.getElementById('current-date-display')) document.getElementById('current-date-display').innerText = dateStr;
    }, 1000);

    function togglePinInput() {
      const isAdmin = document.getElementById('isAdmin').checked;
      const pinContainer = document.getElementById('pin-container');
      const pinInput = document.getElementById('pin');
      if (isAdmin) {
        pinContainer.classList.add('hidden');
        pinInput.removeAttribute('required');
      } else {
        pinContainer.classList.remove('hidden');
        pinInput.setAttribute('required', 'true');
      }
    }

    function togglePasswordVisibility() {
      const pass = document.getElementById('password');
      pass.type = pass.type === 'password' ? 'text' : 'password';
    }

    // --- HANDLE LOGIN SUPABASE ---
    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const pin = document.getElementById('pin').value.trim();
      const isAdmin = document.getElementById('isAdmin').checked;

      document.getElementById('global-loading').classList.remove('hidden');

      try {
        if (isAdmin) {
          // Autentikasi Admin/Guru dari tabel 'users'
          const { data, error } = await supabaseClient
            .from('users')
            .select('*')
            .eq('id', username)
            .eq('password', password)
            .in('role', ['Admin', 'Guru'])
            .single();

          if (error || !data) throw new Error('User ID atau Password Admin salah.');
          
          currentUser = data;
          document.getElementById('global-loading').classList.add('hidden');
          initAdminPanel();
        } else {
          // Autentikasi Siswa + Verifikasi PIN Ujian aktif
          const { data: student, error: errS } = await supabaseClient
            .from('users')
            .select('*')
            .eq('id', username)
            .eq('password', password)
            .single();

          if (errS || !student) throw new Error('User ID atau Password Siswa salah.');

          // Cek Ujian berdasarkan PIN
          const { data: exam, error: errEx } = await supabaseClient
            .from('exams')
            .select('*')
            .eq('pin', pin)
            .eq('status', 'Aktif')
            .single();

          if (errEx || !exam) throw new Error('PIN Sesi Ujian tidak valid atau ujian tidak aktif.');

          currentUser = student;
          currentExam = exam;

          document.getElementById('global-loading').classList.add('hidden');
          initStudentExam(exam);
        }
      } catch (err) {
        document.getElementById('global-loading').classList.add('hidden');
        Swal.fire('Gagal Login', err.message, 'error');
      }
    }

    // --- ADMIN PANEL INIT ---
    function initAdminPanel() {
      document.getElementById('page-login').classList.add('hidden');
      document.getElementById('page-admin').classList.remove('hidden');
      showAdminTab('dash-home');
    }

    async function showAdminTab(tabId, el) {
      if (el) {
        document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
      }
      const content = document.getElementById('admin-content');
      const title = document.getElementById('admin-header-title');

      if (tabId === 'dash-home') {
        title.innerText = 'Dashboard Overview';
        const { count: examCount } = await supabaseClient.from('exams').select('*', { count: 'exact', head: true });
        const { count: userCount } = await supabaseClient.from('users').select('*', { count: 'exact', head: true });

        content.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="dash-card p-6 flex justify-between items-center">
              <div><p class="text-xs uppercase text-slate-400 font-bold">Total Ujian</p><h3 class="text-3xl font-black">${examCount || 0}</h3></div>
              <div class="stat-card-icon bg-blue-50 text-blue-600"><i class="fas fa-calendar-alt"></i></div>
            </div>
            <div class="dash-card p-6 flex justify-between items-center">
              <div><p class="text-xs uppercase text-slate-400 font-bold">Total Pengguna</p><h3 class="text-3xl font-black">${userCount || 0}</h3></div>
              <div class="stat-card-icon bg-emerald-50 text-emerald-600"><i class="fas fa-users"></i></div>
            </div>
            <div class="dash-card p-6 flex justify-between items-center">
              <div><p class="text-xs uppercase text-slate-400 font-bold">Status Koneksi</p><h3 class="text-xl font-bold text-emerald-600">Terhubung</h3></div>
              <div class="stat-card-icon bg-purple-50 text-purple-600"><i class="fas fa-database"></i></div>
            </div>
          </div>`;
      } else if (tabId === 'dash-exams') {
        title.innerText = 'Manajemen Jadwal Ujian';
        const { data: exams } = await supabaseClient.from('exams').select('*');
        content.innerHTML = `
          <div class="dash-card p-6">
            <h3 class="font-bold text-lg mb-4">Daftar Jadwal Ujian Supabase</h3>
            <table class="w-full text-left border-collapse">
              <thead><tr class="border-b text-xs text-slate-400 uppercase"><th>Mapel</th><th>Kelas</th><th>PIN</th><th>Status</th></tr></thead>
              <tbody>
                ${(exams || []).map(ex => `<tr class="border-b"><td class="py-3 font-bold">${ex.subject}</td><td>${ex.class}</td><td><span class="bg-yellow-50 text-yellow-800 px-2 py-1 rounded font-mono">${ex.pin}</span></td><td>${ex.status}</td></tr>`).join('')}
              </tbody>
            </table>
          </div>`;
      }
    }

    // --- STUDENT EXAM INIT ---
    async function initStudentExam(examData) {
      document.getElementById('page-login').classList.add('hidden');
      document.getElementById('page-exam').classList.remove('hidden');

      document.getElementById('exam-subject-title').innerText = examData.subject;
      document.getElementById('student-id-display').innerText = currentUser.id;
      document.getElementById('student-name-display').innerText = currentUser.username;

      // Ambil Soal dari Supabase
      const { data: qData, error } = await supabaseClient
        .from('questions')
        .select('*')
        .eq('exam_id', examData.id);

      if (error || !qData || qData.length === 0) {
        Swal.fire('Informasi', 'Belum ada soal untuk ujian ini.', 'info').then(() => location.reload());
        return;
      }

      questions = qData;
      renderNavGrid();
      renderQuestion(0);
      startTimer(examData.duration || 60);
    }

    function renderQuestion(index) {
      currentQIndex = index;
      const q = questions[index];
      if (!answers[q.id]) answers[q.id] = '';

      const container = document.getElementById('question-container');
      container.innerHTML = `
        <div class="flex justify-between mb-4">
          <span class="text-xs font-bold text-slate-400 uppercase">Soal No. ${index + 1}</span>
          <span class="bg-blue-50 text-blue-600 px-2 py-0.5 rounded text-[10px] font-bold">${q.type}</span>
        </div>
        <div class="text-base text-slate-800 font-medium mb-6">${q.content}</div>
        <div class="space-y-3" id="options-wrapper"></div>`;

      const optWrapper = document.getElementById('options-wrapper');
      const options = typeof q.options === 'string' ? JSON.parse(q.options) : (q.options || []);

      options.forEach((opt) => {
        const isChecked = answers[q.id] === opt;
        const div = document.createElement('div');
        div.className = `option-label ${isChecked ? 'checked' : ''}`;
        div.onclick = () => {
          document.querySelectorAll('.option-label').forEach(el => el.classList.remove('checked'));
          div.classList.add('checked');
          answers[q.id] = opt;
          updateNavStyle();
        };
        div.innerHTML = `<div class="custom-radio"></div><div class="text-sm font-medium">${opt}</div>`;
        optWrapper.appendChild(div);
      });

      updateNavStyle();
    }

    function renderNavGrid() {
      document.getElementById('nav-grid').innerHTML = questions.map((q, i) => 
        `<button id="nav-btn-${i}" onclick="renderQuestion(${i})" class="nav-btn-modern">${i+1}</button>`
      ).join('');
    }

    function updateNavStyle() {
      questions.forEach((q, i) => {
        const btn = document.getElementById(`nav-btn-${i}`);
        if (btn) {
          btn.className = 'nav-btn-modern';
          if (i === currentQIndex) btn.classList.add('current');
          else if (answers[q.id]) btn.classList.add('answered');
        }
      });
    }

    function prevQ() { if (currentQIndex > 0) renderQuestion(currentQIndex - 1); }
    function nextQ() { if (currentQIndex < questions.length - 1) renderQuestion(currentQIndex + 1); }

    function startTimer(durationMinutes) {
      let t = durationMinutes * 60;
      timerInterval = setInterval(() => {
        const h = Math.floor(t / 3600).toString().padStart(2, '0');
        const m = Math.floor((t % 3600) / 60).toString().padStart(2, '0');
        const s = (t % 60).toString().padStart(2, '0');
        document.getElementById('timer-display').innerText = `${h}:${m}:${s}`;
        if (--t < 0) {
          clearInterval(timerInterval);
          finishExamManual(true);
        }
      }, 1000);
    }

    async function finishExamManual(isTimeout = false) {
      clearInterval(timerInterval);
      document.getElementById('global-loading').classList.remove('hidden');

      // Simpan hasil ke Supabase (tabel 'exam_results')
      const { error } = await supabaseClient.from('exam_results').insert([{
        exam_id: currentExam.id,
        user_id: currentUser.id,
        answers: JSON.stringify(answers),
        status: isTimeout ? 'Waktu Habis' : 'Selesai',
        submitted_at: new Date()
      }]);

      document.getElementById('global-loading').classList.add('hidden');
      if (error) {
        Swal.fire('Error', 'Gagal mengirim jawaban: ' + error.message, 'error');
      } else {
        Swal.fire('Berhasil', 'Ujian telah selesai dan jawaban berhasil dikirim.', 'success').then(() => location.reload());
      }
    }

    function logout() {
      location.reload();
    }
  </script>
</body>
</html>
